<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title{ fill:#2f3d35; font-size:18px; font-weight:700; }
      .lane { stroke-width:3; }
      .lbl  { font-size:13px; font-weight:600; }
      .tag  { fill:#2f3d35; font-size:11px; font-weight:600; }
      .cap  { fill:#6b7a70; font-size:11px; }
      .conn { stroke-width:2; fill:none; }
    </style>
  </defs>

  <text x="30" y="34" class="title">Stratégie de branches — GitFlow</text>

  <!-- Lane lines -->
  <line class="lane" x1="150" y1="80"  x2="910" y2="80"  stroke="#5b7d68"/>
  <line class="lane" x1="150" y1="160" x2="910" y2="160" stroke="#b06a5a"/>
  <line class="lane" x1="150" y1="240" x2="910" y2="240" stroke="#b98b3e"/>
  <line class="lane" x1="150" y1="320" x2="910" y2="320" stroke="#3f6e8c"/>
  <line class="lane" x1="150" y1="400" x2="910" y2="400" stroke="#7a5aa0"/>

  <!-- Lane labels -->
  <text x="20" y="84"  class="lbl" fill="#5b7d68">main</text>
  <text x="20" y="164" class="lbl" fill="#b06a5a">hotfix</text>
  <text x="20" y="244" class="lbl" fill="#b98b3e">release</text>
  <text x="20" y="324" class="lbl" fill="#3f6e8c">develop</text>
  <text x="20" y="404" class="lbl" fill="#7a5aa0">feature</text>

  <!-- Connectors (branch / merge) -->
  <!-- main -> develop (création) -->
  <path class="conn" stroke="#3f6e8c" d="M175,80 C210,80 215,320 250,320"/>
  <!-- develop -> feature (création) -->
  <path class="conn" stroke="#7a5aa0" d="M300,320 C325,320 320,400 345,400"/>
  <!-- feature -> develop (merge) -->
  <path class="conn" stroke="#7a5aa0" d="M405,400 C430,400 425,320 450,320"/>
  <!-- develop -> release (création) -->
  <path class="conn" stroke="#b98b3e" d="M505,320 C530,320 525,240 550,240"/>
  <!-- release -> main (merge, tag) -->
  <path class="conn" stroke="#b98b3e" d="M600,240 C625,240 620,80 645,80"/>
  <!-- release -> develop (merge retour) -->
  <path class="conn" stroke="#b98b3e" d="M600,240 C625,240 640,320 665,320"/>
  <!-- main -> hotfix (création) -->
  <path class="conn" stroke="#b06a5a" d="M745,80 C770,80 765,160 790,160"/>
  <!-- hotfix -> main (merge, tag) -->
  <path class="conn" stroke="#b06a5a" d="M835,160 C858,160 855,80 878,80"/>
  <!-- hotfix -> develop (merge retour) -->
  <path class="conn" stroke="#b06a5a" d="M835,160 C860,160 860,320 883,320"/>

  <!-- Commits (dots) -->
  <!-- main -->
  <circle cx="175" cy="80" r="7" fill="#5b7d68"/>
  <circle cx="645" cy="80" r="7" fill="#5b7d68"/>
  <text x="632" y="66" class="tag">v1.0</text>
  <circle cx="878" cy="80" r="7" fill="#5b7d68"/>
  <text x="860" y="66" class="tag">v1.0.1</text>
  <!-- develop -->
  <circle cx="250" cy="320" r="7" fill="#3f6e8c"/>
  <circle cx="450" cy="320" r="7" fill="#3f6e8c"/>
  <circle cx="665" cy="320" r="7" fill="#3f6e8c"/>
  <circle cx="883" cy="320" r="7" fill="#3f6e8c"/>
  <!-- feature -->
  <circle cx="345" cy="400" r="7" fill="#7a5aa0"/>
  <circle cx="405" cy="400" r="7" fill="#7a5aa0"/>
  <!-- release -->
  <circle cx="550" cy="240" r="7" fill="#b98b3e"/>
  <circle cx="600" cy="240" r="7" fill="#b98b3e"/>
  <!-- hotfix -->
  <circle cx="790" cy="160" r="7" fill="#b06a5a"/>
  <circle cx="835" cy="160" r="7" fill="#b06a5a"/>

  <!-- Captions -->
  <text x="330" y="440" class="cap">feature/connexion</text>
  <text x="540" y="216" class="cap">release/1.0</text>
  <text x="775" y="140" class="cap">hotfix/1.0.1</text>
</svg>
