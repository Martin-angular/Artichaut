<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b7d68"/>
    </marker>
    <style>
      .root  { fill:#5b7d68; stroke:#415c4c; }
      .cat   { fill:#8FAE9B; stroke:#5b7d68; }
      .leaf  { fill:#ffffff; stroke:#9bb3a4; }
      .tr    { fill:#ffffff; font-weight:600; font-size:15px; }
      .tc    { fill:#ffffff; font-weight:600; font-size:14px; }
      .tl    { fill:#2f3d35; font-size:12.5px; }
      .ln    { stroke:#5b7d68; stroke-width:1.6; fill:none; }
      .title { fill:#2f3d35; font-size:20px; font-weight:700; }
      .note  { fill:#6b7a70; font-size:12px; }
      .dash  { fill:none; stroke:#b98b3e; stroke-width:1.4; stroke-dasharray:6 5; }
    </style>
  </defs>

  <text x="40" y="38" class="title">Arborescence — Site Hôtel Artichaut</text>

  <!-- Root -->
  <rect x="560" y="66" width="200" height="46" rx="8" class="root"/>
  <text x="660" y="94" text-anchor="middle" class="tr">Accueil — Vitrine</text>

  <!-- Root -> categories -->
  <path class="ln" d="M660,112 L145,170"/>
  <path class="ln" d="M660,112 L485,170"/>
  <path class="ln" d="M660,112 L825,170"/>
  <path class="ln" d="M660,112 L1165,170"/>

  <!-- Category boxes -->
  <rect x="45"   y="170" width="200" height="44" rx="8" class="cat"/>
  <text x="145"  y="197" text-anchor="middle" class="tc">Sections vitrine</text>
  <rect x="385"  y="170" width="200" height="44" rx="8" class="cat"/>
  <text x="485"  y="197" text-anchor="middle" class="tc">Réservation</text>
  <rect x="725"  y="170" width="200" height="44" rx="8" class="cat"/>
  <text x="825"  y="197" text-anchor="middle" class="tc">Compte</text>
  <rect x="1065" y="170" width="200" height="44" rx="8" class="cat"/>
  <text x="1165" y="197" text-anchor="middle" class="tc">Espace client</text>

  <!-- COL 1 : Sections vitrine (siblings) -->
  <path class="ln" d="M145,214 L145,248"/>
  <path class="ln" d="M145,288 L145,302"/>
  <path class="ln" d="M145,342 L145,356"/>
  <path class="ln" d="M145,396 L145,410"/>
  <path class="ln" d="M145,450 L145,464"/>
  <path class="ln" d="M145,504 L145,518"/>
  <rect x="45" y="248" width="200" height="40" rx="6" class="leaf"/><text x="145" y="273" text-anchor="middle" class="tl">Hero</text>
  <rect x="45" y="302" width="200" height="40" rx="6" class="leaf"/><text x="145" y="327" text-anchor="middle" class="tl">Avantages</text>
  <rect x="45" y="356" width="200" height="40" rx="6" class="leaf"/><text x="145" y="381" text-anchor="middle" class="tl">Vidéo</text>
  <rect x="45" y="410" width="200" height="40" rx="6" class="leaf"/><text x="145" y="435" text-anchor="middle" class="tl">Avis clients</text>
  <rect x="45" y="464" width="200" height="40" rx="6" class="leaf"/><text x="145" y="489" text-anchor="middle" class="tl">Actualités</text>
  <rect x="45" y="518" width="200" height="40" rx="6" class="leaf"/><text x="145" y="543" text-anchor="middle" class="tl">Footer</text>

  <!-- COL 2 : Réservation (sequential, arrows) -->
  <path class="ln" d="M485,214 L485,248" marker-end="url(#arr)"/>
  <path class="ln" d="M485,288 L485,302" marker-end="url(#arr)"/>
  <path class="ln" d="M485,342 L485,356" marker-end="url(#arr)"/>
  <path class="ln" d="M485,396 L485,410" marker-end="url(#arr)"/>
  <path class="ln" d="M485,450 L485,464" marker-end="url(#arr)"/>
  <rect x="385" y="248" width="200" height="40" rx="6" class="leaf"/><text x="485" y="273" text-anchor="middle" class="tl">Recherche (dates &amp; pers.)</text>
  <rect x="385" y="302" width="200" height="40" rx="6" class="leaf"/><text x="485" y="327" text-anchor="middle" class="tl">Disponibilité &amp; chambre</text>
  <rect x="385" y="356" width="200" height="40" rx="6" class="leaf"/><text x="485" y="381" text-anchor="middle" class="tl">Choix des options</text>
  <rect x="385" y="410" width="200" height="40" rx="6" class="leaf"/><text x="485" y="435" text-anchor="middle" class="tl">Récap. &amp; paiement</text>
  <rect x="385" y="464" width="200" height="40" rx="6" class="leaf"/><text x="485" y="489" text-anchor="middle" class="tl">Confirmation</text>

  <!-- COL 3 : Compte -->
  <path class="ln" d="M825,214 L825,248"/>
  <path class="ln" d="M825,288 L825,302"/>
  <rect x="725" y="248" width="200" height="40" rx="6" class="leaf"/><text x="825" y="273" text-anchor="middle" class="tl">Inscription (email / social)</text>
  <rect x="725" y="302" width="200" height="40" rx="6" class="leaf"/><text x="825" y="327" text-anchor="middle" class="tl">Connexion</text>

  <!-- COL 4 : Espace client -->
  <path class="ln" d="M1165,214 L1165,248"/>
  <path class="ln" d="M1165,288 L1165,302"/>
  <rect x="1065" y="248" width="200" height="40" rx="6" class="leaf"/><text x="1165" y="273" text-anchor="middle" class="tl">Mes réservations</text>
  <rect x="1065" y="302" width="200" height="40" rx="6" class="leaf"/><text x="1165" y="327" text-anchor="middle" class="tl">Historique &amp; remises</text>

  <!-- Back-office cluster (separate) -->
  <rect x="705" y="600" width="470" height="150" rx="10" class="dash"/>
  <text x="720" y="622" class="note">Zone séparée — accès restreint</text>
  <rect x="825" y="636" width="230" height="44" rx="8" class="cat"/>
  <text x="940" y="663" text-anchor="middle" class="tc">Back-office</text>
  <path class="ln" d="M940,680 L800,704"/>
  <path class="ln" d="M940,680 L1080,704"/>
  <rect x="700" y="704" width="200" height="40" rx="6" class="leaf"/><text x="800" y="729" text-anchor="middle" class="tl">Personnel (résa, factures)</text>
  <rect x="980" y="704" width="200" height="40" rx="6" class="leaf"/><text x="1080" y="729" text-anchor="middle" class="tl">Admin (chambres, contenus…)</text>
</svg>
