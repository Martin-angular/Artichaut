# Pipeline CI — bac à sable Hôtel Artichaut
# Build + tests du back (Spring Boot / Maven) et du front (Vue.js / Vitest).

stages:
  - build
  - test
  - notify

# ---------- BACK (Spring Boot / Maven) ----------
back-build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  script:
    - mvn -f back/pom.xml -B compile
  rules:
    - exists: ["back/pom.xml"]

back-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  script:
    - mvn -f back/pom.xml -B test
  rules:
    - exists: ["back/pom.xml"]

# ---------- FRONT (Vue.js / Vite / Vitest) ----------
front-build:
  stage: build
  image: node:20
  cache:
    key: npm
    paths:
      - front/node_modules
  script:
    - cd front
    - npm ci
    - npm run build
  rules:
    - exists: ["front/package.json"]

front-test:
  stage: test
  image: node:20
  cache:
    key: npm
    paths:
      - front/node_modules
  script:
    - cd front
    - npm ci
    - npm run test
  rules:
    - exists: ["front/package.json"]

# ---------- NOTIFY ClickUp ----------
clickup-notify:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      TASK_ID=$(echo "$CI_COMMIT_MESSAGE" | grep -oE 'CU-[a-z0-9]+' | head -1 | sed 's/CU-//')

      if [ -z "$TASK_ID" ]; then
        echo "Aucun identifiant ClickUp trouvé dans le commit, pipeline ignoré."
        exit 0
      fi

      echo "Tâche ClickUp détectée : $TASK_ID"

      COMMENT="Commit GitLab | $CI_COMMIT_TITLE | $CI_COMMIT_SHORT_SHA | $CI_COMMIT_REF_NAME | $CI_COMMIT_AUTHOR"
      JSON=$(jq -n --arg text "$COMMENT" '{"comment_text": $text}')

      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
        "https://api.clickup.com/api/v2/task/$TASK_ID/comment" \
        -H "Authorization: $CLICKUP_API_TOKEN" \
        -H "Content-Type: application/json" \
        -d "$JSON")

      HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
      BODY=$(echo "$RESPONSE" | head -1)

      echo "HTTP status : $HTTP_STATUS"
      echo "Réponse API : $BODY"

      if [ "$HTTP_STATUS" = "200" ]; then
        echo "Commentaire posté avec succès sur la tâche ClickUp $TASK_ID."
      else
        echo "Erreur lors de l'appel ClickUp."
        exit 1
      fi
  needs: []
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /CU-[a-z0-9]+/'
